<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Habibi</title><link rel="stylesheet" href="/assets/core.css"></head>
<body><header class="topbar"><a class="wordmark" href="/"><img src="/assets/habibi-logo.svg" alt="">Habibi</a><nav class="topnav"><a href="/trace?view=graph">Live graph</a><a href="/trace">Trace</a><a href="/events">Events</a><a href="/logs">Logs</a><a href="/stats">Stats</a><a href="/extensions">Extensions</a><a href="/settings" aria-current="page">Settings</a></nav></header>
<main class="settings-shell"><div class="page-heading"><div><p class="eyebrow">CORE POLICY</p><h1>Boundaries</h1></div><p>Global maximum access for every extension using filesystem or process APIs. Exclusions always win.</p></div>
<form id="boundary-form" class="boundary-form">
<section><h2>Directories</h2><label>Included directories<textarea id="directory-includes" rows="6" spellcheck="false" placeholder="/home/you/code"></textarea><small>One existing absolute directory per line.</small></label><label>Excluded directories<textarea id="directory-excludes" rows="6" spellcheck="false"></textarea><small>Operations inside excluded directories are denied.</small></label></section>
<section><h2>Programs</h2><label>Included programs<textarea id="program-includes" rows="6" spellcheck="false" placeholder="/usr/bin/git"></textarea><small>One absolute native executable per line. Extensions may address an unambiguous program by basename.</small></label><label>Excluded programs<textarea id="program-excludes" rows="6" spellcheck="false"></textarea><small>Exclusions override matching includes. Programs may launch helpers; approve interpreters and shells only deliberately.</small></label></section>
<div class="boundary-actions"><button class="primary" type="submit">Save boundaries</button><span id="boundary-status" class="muted" role="status"></span></div></form></main><script type="module" src="/assets/settings.js"></script></body></html>
