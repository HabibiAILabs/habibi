<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Habibi</title><link rel="stylesheet" href="/assets/core.css"></head>
<body><header class="topbar"><a class="wordmark" href="/"><img src="/assets/habibi-logo.svg" alt="">Habibi</a><nav class="topnav"><a href="/trace?view=graph">Live graph</a><a href="/trace">Trace</a><a href="/events">Events</a><a href="/logs">Logs</a><a href="/stats">Stats</a><a href="/extensions">Extensions</a><a href="/settings" aria-current="page">Settings</a></nav></header>
<main class="settings-shell"><div class="page-heading"><div><p class="eyebrow">CORE POLICY</p><h1>Boundaries</h1></div><p>Global maximum access for every extension using filesystem or process APIs. The most specific matching rule wins; includes win ties.</p></div>
<form id="boundary-form" class="boundary-form">
<section><h2>Directories</h2><label>Included directories<textarea id="directory-includes" rows="6" spellcheck="false" placeholder="/home/you/code"></textarea><small>One absolute path pattern per line, or `*` for everything. `*` and `?` are supported.</small></label><label>Excluded directories<textarea id="directory-excludes" rows="6" spellcheck="false"></textarea><small>More-specific includes can override broad exclusions such as `*`.</small></label></section>
<section><h2>Programs</h2><label>Included programs<textarea id="program-includes" rows="6" spellcheck="false" placeholder="/usr/bin/git"></textarea><small>One absolute executable pattern per line, or `*`. Basenames resolve only from deterministic matching system paths.</small></label><label>Excluded programs<textarea id="program-excludes" rows="6" spellcheck="false"></textarea><small>The most specific rule wins; includes win ties. Programs may launch helpers, so approve interpreters and shells deliberately.</small></label></section>
<div class="boundary-actions"><button class="primary" type="submit">Save boundaries</button><span id="boundary-status" class="muted" role="status"></span></div></form></main><script type="module" src="/assets/settings.js"></script></body></html>
