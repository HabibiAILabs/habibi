  <path d="M92 70v180M228 70v180M92 160h136" fill="none" stroke="#263229" stroke-width="30" stroke-linecap="round"/>
  <path d="M92 70v180M228 70v180M92 160h136" fill="none" stroke="url(#glow)" stroke-width="10" stroke-linecap="round" filter="url(#soft)"/>
