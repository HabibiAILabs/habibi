<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · Habibi</title>
  <link rel="stylesheet" href="/assets/core.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/"><img src="/assets/habibi-logo.svg" alt="">Habibi</a>
    <nav class="topnav"><a href="/events">Events</a><a href="/extensions">Extensions</a></nav>
  </header>
  <main class="events-shell">
    <div class="page-heading">
      <div><p class="eyebrow">DURABLE HISTORY</p><h1>Events</h1></div>
      <p>Inspect Habibi's canonical event stream, including complete model prompts, reactions, and responses.</p>
    </div>

    <form id="event-filters" class="event-filters">
      <label>Window
        <select name="window">
          <option value="all">All time</option><option value="15m">Last 15 minutes</option>
          <option value="1h">Last hour</option><option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option><option value="30d">Last 30 days</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label>Event type<input name="type" list="event-types" placeholder="e.g. model.invocation.completed"></label>
      <datalist id="event-types">
        <option value="model.invocation.started"><option value="model.invocation.completed">
        <option value="model.invocation.failed"><option value="chat.message.created">
        <option value="chat.session.created"><option value="runtime.started">
      </datalist>
      <label>Type prefix<input name="prefix" placeholder="e.g. model."></label>
      <label>Source<input name="source" placeholder="e.g. habibi"></label>
      <label>Payload contains<input name="payload_contains" placeholder="case-insensitive text"></label>
      <label>Correlation ID<input name="correlation_id" placeholder="UUID"></label>
      <label>Limit
        <select name="limit"><option>25</option><option selected>100</option><option>250</option><option>500</option><option>1000</option></select>
      </label>
      <label class="custom-time" hidden>From<input name="from" type="datetime-local"></label>
      <label class="custom-time" hidden>To<input name="to" type="datetime-local"></label>
      <button class="primary" type="submit">Query events</button>
      <button class="secondary" id="model-reactions" type="button">Model reactions</button>
      <button class="secondary" id="actions" type="button">Tool actions</button>
    </form>

    <div class="event-summary"><span id="event-count">0 events</span><span id="event-range"></span></div>
    <section id="event-list" class="event-list" aria-live="polite"></section>
    <button id="load-older" class="secondary load-older" type="button" hidden>Load older events</button>
  </main>
  <script type="module" src="/assets/events.js"></script>
</body>
</html>
