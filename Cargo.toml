[package]
name = "habibi"
version = "0.1.0"
edition = "2024"
description = "A local, event-sourced AI runtime with one continuous conversation"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
mime_guess = "2"
mlua = { version = "0.11", features = ["lua54", "send", "serialize", "vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
